name: Update Items and Icons

on:
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight UTC

jobs:
  refresh-assets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r UI/requirements.txt

    - name: Update items data
      env:
        API_KEY: ${{ secrets.DARKERDB_API_KEY }}
      working-directory: UI
      run: python scripts/update_items.py

    - name: Rebuild icon pack
      working-directory: UI
      run: python scripts/build_icons_pak.py

    - name: Verify icon pack manifest
      working-directory: UI
      run: python scripts/build_icons_pak.py --check --skip-convert

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.verify-changed-files.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Update items data and icon pack"
        title: "Automated item/icon refresh"
        body: |
          This PR contains automated updates to the item data and packaged icons.

          Changes include:
          - Updated `items.json` with new items
          - Downloaded/converted new item icons
          - Rebuilt `icons.pak`

          This PR was automatically generated by the update-items workflow.
        branch: update-items-data
        delete-branch: true