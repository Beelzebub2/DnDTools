name: Update Items

on:
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight UTC

jobs:
  update-items:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd UI
        pip install requests

    - name: Update items
      env:
        API_KEY: ${{ secrets.DARKERDB_API_KEY }}
      run: |
        cd UI
        python update_items.py

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.verify-changed-files.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Update items data from DarkerDB API"
        title: "Automated Item Data Update"
        body: |
          This PR contains automated updates to the item data from DarkerDB API.

          Changes include:
          - Updated `items.json` with new items
          - Downloaded new item icons

          This PR was automatically generated by the update-items workflow.
        branch: update-items-data
        delete-branch: true