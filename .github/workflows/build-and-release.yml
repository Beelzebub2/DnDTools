name: Build and Release DnDTools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v1.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: UI/requirements.txt

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/AppData/Local/pip/Cache
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('UI/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r UI/requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer package
        shell: cmd
        env:
          DNDTOOLS_RELEASE_VERSION: ${{ github.event.inputs.tag }}
        run: |
          installer\build_installer.bat

      - name: Verify PyInstaller outputs
        shell: powershell
        run: |
          if (-not (Test-Path "dist/DnDTools/DnDTools.exe")) {
            throw "DnDTools onedir build missing."
          }
          if (-not (Test-Path "dist/update.exe")) {
            throw "Update executable missing."
          }

      - name: Generate update manifest
        shell: powershell
        env:
          DNDTOOLS_RELEASE_VERSION: ${{ github.event.inputs.tag }}
        run: |
          python scripts/generate_update_manifest.py --release-tag "${{ github.event.inputs.tag }}" --version "${{ github.event.inputs.tag }}"

      - name: Create GitHub Pre-Release and Upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Test-Release ${{ github.event.inputs.tag }}
          files: |
            dist/DnDTools-Setup-*.exe
            dist/update-manifest.json
          fail_on_unmatched_files: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
