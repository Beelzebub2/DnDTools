name: Publish DarkAndDarker version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build via Steam Store API
        id: store
        continue-on-error: true
        shell: pwsh
        env:
          APP_ID: 2016590
        run: |
          $uri = "https://store.steampowered.com/api/appdetails?appids=$($env:APP_ID)&cc=us&l=en&filters=depots"
          $headers = @{ "User-Agent" = "Mozilla/5.0 (GitHubActions)" }
          Write-Host "Querying Steam Store API: $uri"
          $resp = Invoke-RestMethod -Uri $uri -Headers $headers -ErrorAction Stop
          $app = $resp.$($env:APP_ID)
          if (-not $app) { throw "App $env:APP_ID not found in response" }
          if (-not $app.success) { throw "Steam Store returned success=$($app.success)" }
          $buildId = $app.data.depots.branches.public.buildid
          if ([string]::IsNullOrWhiteSpace($buildId)) { throw "Build id missing in store response" }
          Write-Host "Store API build id: $buildId"
          "BUILDID=$buildId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache SteamCMD
        id: cache-steamcmd
        uses: actions/cache@v4
        if: steps.store.outcome == 'failure' || steps.store.outputs.BUILDID == ''
        with:
          path: |
            C:\ProgramData\chocolatey\bin\steamcmd.exe
            C:\ProgramData\chocolatey\lib\steamcmd
            C:\Program Files (x86)\SteamCMD
          key: steamcmd-${{ runner.os }}-v1

      - name: Install SteamCMD
        if: (steps.store.outcome == 'failure' || steps.store.outputs.BUILDID == '') && steps.cache-steamcmd.outputs.cache-hit != 'true'
        run: choco install steamcmd -y

      - name: Query app_info (anonymous)
        id: appinfo
        if: steps.store.outcome == 'failure' || steps.store.outputs.BUILDID == ''
        continue-on-error: true
        shell: pwsh
        env:
          APP_ID: 2016590
        run: |
          $steamcmd = (Get-Command steamcmd.exe -ErrorAction Stop).Source
          Write-Host "Using SteamCMD at $steamcmd"
          $args = @(
            "+login", "anonymous",
            "+app_info_update", "1",
            "+app_info_print", $env:APP_ID,
            "+quit"
          )
          $out = & $steamcmd $args 2>&1
          $m = [regex]::Match($out, '"buildid"\s+"(\d+)"')
          if (-not $m.Success) { throw "buildid not found in app_info_print output" }
          "BUILDID=$($m.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Query app_info (authenticated fallback)
        id: appinfo_auth
        if: (steps.store.outcome == 'failure' || steps.store.outputs.BUILDID == '') && (steps.appinfo.outcome == 'failure' || steps.appinfo.outputs.BUILDID == '')
        shell: pwsh
        env:
          APP_ID: 2016590
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          if (-not $env:STEAM_USERNAME -or -not $env:STEAM_PASSWORD) {
            throw "STEAM_USERNAME or STEAM_PASSWORD secrets are not set"
          }
          $steamcmd = (Get-Command steamcmd.exe -ErrorAction Stop).Source
          Write-Host "Using SteamCMD at $steamcmd"
          $args = @(
            "+login", $env:STEAM_USERNAME, $env:STEAM_PASSWORD,
            "+app_info_update", "1",
            "+app_info_print", $env:APP_ID,
            "+quit"
          )
          $out = & $steamcmd $args 2>&1
          $m = [regex]::Match($out, '"buildid"\s+"(\d+)"')
          if (-not $m.Success) { throw "buildid not found in authenticated app_info_print output" }
          "BUILDID=$($m.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Write JSON
        shell: pwsh
        run: |
          $buildId = "${{ steps.store.outputs.BUILDID || steps.appinfo.outputs.BUILDID || steps.appinfo_auth.outputs.BUILDID }}"
          if ([string]::IsNullOrWhiteSpace($buildId)) {
            throw "Unable to determine build id from Steam Store API or SteamCMD"
          }
          $obj = [ordered]@{
            app_id  = 2016590
            buildid = $buildId
            checked = (Get-Date).ToUniversalTime().ToString("o")
          }
          $json = ($obj | ConvertTo-Json -Depth 5)
          Set-Content -Path DnDversion.json -Value $json -Encoding UTF8

      - name: Commit JSON
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DnDversion.json
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          }
          else {
            git commit -m "Update Dark and Darker buildid"
            git push
          }
