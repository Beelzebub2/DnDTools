name: Publish DarkAndDarker version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve build and update JSON
        shell: pwsh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          python tools\scripts\fetch_build_id.py --app-id 2016590 --output DnDversion.json

      - name: Commit JSON
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DnDversion.json
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          }
          else {
            git commit -m "Update Dark and Darker buildid"
            git push
          }
